<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Timetable Finder — IIT Patna</title>
<meta name="description" content="Look up your personal weekly class timetable — IIT Patna CST.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <rect width='100' height='100' rx='18' fill='%23050505'/>
        <text x='50%25' y='62%25'
              text-anchor='middle'
              font-size='64'
              fill='%23d4af37'
              font-family='Arial'
              font-weight='700'>θ</text>
      </svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <button class="icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 5H18M2 10H18M2 15H18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <div class="settings-panel" id="settingsPanel" hidden>
      <button class="settings-panel__item" id="resetBtn" type="button">Reset</button>
      <div class="settings-panel__item settings-panel__item--row">
        <span>Dark mode</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="true" aria-label="Toggle dark mode">
          <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="page">
  <div class="hero">
    <h1 class="hero__title">Class Timetable</h1>
    <span class="hero__eyebrow">IIT PATNA - CST</span>
  </div>

  <!-- Timetable container visible by default -->
  <div id="agenda"></div>
</main>
      

<footer>Made with 💙 by Satyam</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
